[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "civic-orchestrator"
version = "0.2.0"
requires-python = ">=3.11"
license = {text = "BSD-3-Clause"}
dependencies = [
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
  "referencing>=0.30,<1",
  "rfc3339-validator>=0.1.4,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
